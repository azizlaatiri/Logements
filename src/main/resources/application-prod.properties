# Configuration email SMTP (Gmail) - active uniquement avec le profil "prod"
# spring.mail.password est un "mot de passe d'application" Gmail (PAS le mot de passe du compte),
# fourni via la variable d'environnement GMAIL_APP_PASSWORD (jamais committe en clair) :
# https://myaccount.google.com/apppasswords (necessite la validation en 2 etapes activee sur le compte)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=laatiriaziz15@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
